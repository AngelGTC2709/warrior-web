<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Restablecer contraseña | Warrior Kids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
    integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"
    crossorigin="anonymous"></script>
  <script defer src="restablecer.js"></script>
</head>
<body class="auth-page">

  <header class="nav" id="top">
    <div class="nav__inner">
      <a class="brand" href="index.html" aria-label="Warrior Kids, volver al inicio">
        <svg class="brand__shield" viewBox="0 0 40 46" aria-hidden="true">
          <path d="M20 2 4 8v13c0 11 7 19 16 23 9-4 16-12 16-23V8L20 2Z" fill="var(--pink)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M20 9v29c6-3 10-9 10-17v-9l-10-3Z" fill="var(--orange)"/>
        </svg>
        <span>Warrior Kids</span>
      </a>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Cambiar tema claro u oscuro">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle class="sun" cx="12" cy="12" r="5"/>
          <path class="moon" d="M21 13.5A8.5 8.5 0 1 1 10.5 3a7 7 0 0 0 10.5 10.5Z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="blobs" aria-hidden="true"><i class="b1"></i><i class="b2"></i></div>

    <div class="auth-card reveal in">
      <div class="auth-card__badge">
        <i data-lucide="key-round"></i>
      </div>
      <h1>Restablecer contraseña</h1>
      <p class="auth-card__lead">Recupera el acceso a tu cuenta tutora de Warrior Kids.</p>

      <div id="mensaje" class="auth-status" role="status" aria-live="polite">Revisando el enlace…</div>

      <button id="verificar" class="btn btn--orange auth-btn" type="button" hidden>
        <i data-lucide="shield-check"></i> Continuar
      </button>

      <form id="formulario" class="auth-form" hidden novalidate>
        <p id="cuenta" class="auth-account"></p>

        <div class="auth-field">
          <label for="contrasena">Nueva contraseña</label>
          <div class="auth-input-wrap">
            <i data-lucide="lock" class="auth-input-ico"></i>
            <input id="contrasena" type="password" autocomplete="new-password" minlength="6" placeholder="Mínimo 6 caracteres" required>
            <button type="button" class="auth-eye" data-target="contrasena" aria-label="Mostrar u ocultar contraseña">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <div class="auth-field">
          <label for="confirmacion">Confirma tu nueva contraseña</label>
          <div class="auth-input-wrap">
            <i data-lucide="lock-keyhole" class="auth-input-ico"></i>
            <input id="confirmacion" type="password" autocomplete="new-password" minlength="6" placeholder="Repite tu contraseña" required>
            <button type="button" class="auth-eye" data-target="confirmacion" aria-label="Mostrar u ocultar confirmación">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <button id="guardar" class="btn btn--orange auth-btn" type="submit">
          <i data-lucide="check-circle-2"></i> Actualizar contraseña
        </button>
      </form>

      <p class="auth-back">
        <a href="index.html"><i data-lucide="arrow-left"></i> Volver al sitio de Warrior Kids</a>
      </p>
    </div>
  </main>

</body>
</html>
